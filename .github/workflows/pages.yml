# Host the arena, poll, rankings, and data/ history on GitHub Pages.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # Data-only commits should not thrash the site deploy.
    paths-ignore:
      - "data/**"
      - ".data/**"
  workflow_dispatch:
  # Redeploy Pages after a stream finishes so ranking history is public.
  workflow_run:
    workflows: ["Go Live — FLAG BATTLE"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Let an in-flight deploy finish; don't cancel on every follow-up push.
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
