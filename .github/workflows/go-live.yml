# Auto-create a YouTube livestream and push FLAG BATTLE (no OBS).
#
# Required repository secrets:
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   GOOGLE_REFRESH_TOKEN
# Optional:
#   NIGHTBOT_TOKEN — auto-update Nightbot !vote to the live tunnel
#
# Trigger from your own cron / server with workflow_dispatch (see README).
# One livestream = Opening → Main → Alien Invasion (unified full battle).

name: Go Live — FLAG BATTLE

on:
  workflow_dispatch:
    inputs:
      demo_seconds:
        description: "Shorten clock in seconds (leave empty = full length)"
        required: false
        default: ""
      privacy:
        description: "YouTube privacyStatus (public | unlisted | private)"
        required: false
        default: "public"
      duration_minutes:
        description: "Optional safety cap in minutes (empty = run until winner hold ends)"
        required: false
        default: ""
      retry_attempt:
        description: "Internal — auto-incremented when re-dispatching after a pre-live failure"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: go-live
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve stream mode
        id: mode
        run: |
          MODE=$(node stream/src/next-mode.js data/rankings.json)
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Next livestream mode: $MODE (Opening → Main → Invasion in one stream)"
          ATTEMPT="${{ inputs.retry_attempt }}"
          ATTEMPT="${ATTEMPT:-0}"
          echo "retry_attempt=$ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "Go-live attempt #$((ATTEMPT + 1)) (retry_attempt=$ATTEMPT)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb pulseaudio pulseaudio-utils espeak-ng fonts-liberation fonts-dejavu-core
          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version
          espeak-ng --version | head -1

      - name: Install stream package
        working-directory: stream
        run: npm install

      - name: Write credentials
        working-directory: stream
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          NIGHTBOT_TOKEN: ${{ secrets.NIGHTBOT_TOKEN }}
          STREAM_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"
          test -n "$GOOGLE_REFRESH_TOKEN"
          MODE="${STREAM_MODE:-qualifying}"
          # Title is built at go-live: FLAG BATTLE - DD/MM/YYYY #N (+ variations).
          # Override with a secret/env YT_TITLE only if you need a fixed title.
          {
            echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
            echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
            echo "GOOGLE_REFRESH_TOKEN=$GOOGLE_REFRESH_TOKEN"
            echo "YT_PRIVACY=public"
            echo "STREAM_MODE=$MODE"
            echo "STREAM_TITLE_TZ=${STREAM_TITLE_TZ:-UTC}"
            echo "PUBLIC_SITE=https://yung1022.github.io/Flagbattle"
            # Smoother encode on GitHub-hosted runners (Shorts-friendly 9:16)
            echo "STREAM_WIDTH=720"
            echo "STREAM_HEIGHT=1280"
            echo "STREAM_FPS=30"
            # Bare country names need the YouTube chat listener (Nightbot cannot
            # regex every country). Keep Nightbot !vote as a backup.
            echo "CHAT_VOTE=1"
            if [ -n "$NIGHTBOT_TOKEN" ]; then
              echo "NIGHTBOT_TOKEN=$NIGHTBOT_TOKEN"
            fi
          } > .env

      - name: Go live
        id: golive
        working-directory: stream
        env:
          DEMO_SECONDS: ${{ inputs.demo_seconds }}
          DURATION_MIN: ${{ inputs.duration_minutes }}
          PRIVACY: ${{ inputs.privacy }}
          STREAM_MODE: ${{ steps.mode.outputs.mode }}
          PUBLIC_SITE: https://yung1022.github.io/Flagbattle
          STREAM_WIDTH: "720"
          STREAM_HEIGHT: "1280"
          STREAM_FPS: "30"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_DATA_BRANCH: main
        run: |
          set +e
          MODE="${STREAM_MODE:-qualifying}"
          # Uncapped by default — stream ends after champion + 1-minute winner hold.
          # Optional duration_minutes is only a safety wall-clock cap.
          EXTRA=(--mode "$MODE")
          if [ -n "${DEMO_SECONDS}" ]; then
            EXTRA+=(--demo "${DEMO_SECONDS}")
          fi
          EXTRA+=(--privacy "${PRIVACY:-public}")
          if [ -n "${DURATION_MIN}" ]; then
            echo "Go-live mode=$MODE duration_cap=${DURATION_MIN}m (safety)"
            timeout "${DURATION_MIN}m" npm run go-live -- "${EXTRA[@]}"
          else
            echo "Go-live mode=$MODE duration=uncapped (ends after winner hold)"
            npm run go-live -- "${EXTRA[@]}"
          fi
          code=$?
          set -e
          # 124 = timeout hit planned end; treat as clean stop
          if [ "$code" = "124" ] || [ "$code" = "0" ]; then
            echo "outcome=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "outcome=fail" >> "$GITHUB_OUTPUT"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Rerun if failed before going live
        if: failure() && steps.golive.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEMO_SECONDS: ${{ inputs.demo_seconds }}
          DURATION_MIN: ${{ inputs.duration_minutes }}
          PRIVACY: ${{ inputs.privacy }}
          RETRY_ATTEMPT: ${{ steps.mode.outputs.retry_attempt }}
        run: |
          if [ -f .data/went-live ]; then
            echo "Broadcast reached live — not re-dispatching"
            cat .data/went-live || true
            exit 0
          fi
          ATTEMPT="${RETRY_ATTEMPT:-0}"
          MAX=3
          if [ "$ATTEMPT" -ge "$MAX" ]; then
            echo "Already retried $ATTEMPT times (max $MAX) — giving up"
            exit 0
          fi
          NEXT=$((ATTEMPT + 1))
          echo "Pre-live failure — re-dispatching go-live (retry_attempt=$NEXT)"
          ARGS=(workflow run go-live.yml --ref "${{ github.ref_name }}")
          ARGS+=(-f "privacy=${PRIVACY:-public}")
          ARGS+=(-f "retry_attempt=${NEXT}")
          if [ -n "${DEMO_SECONDS}" ]; then
            ARGS+=(-f "demo_seconds=${DEMO_SECONDS}")
          fi
          if [ -n "${DURATION_MIN}" ]; then
            ARGS+=(-f "duration_minutes=${DURATION_MIN}")
          fi
          gh "${ARGS[@]}"
          echo "Re-dispatched Go Live workflow"

      - name: Persist ranking history to data/
        if: always()
        run: |
          mkdir -p data/polls
          if [ -f .data/rankings.json ]; then
            cp .data/rankings.json data/rankings.json
          fi
          if [ -f .data/live.json ]; then
            node <<'NODE'
          const fs = require("fs");
          const live = JSON.parse(fs.readFileSync(".data/live.json", "utf8"));
          const out = {
            live: live.live || null,
            streams: live.streams || [],
            api: null,
            updatedAt: Date.now(),
          };
          // Close unfinished newest stream only after winner hold (not mid-hold).
          const newest = out.streams?.[0];
          const holdActive =
            out.live?.streamStatus === "winner_hold" ||
            (Number(out.live?.winnerHoldRemainingMs) || 0) > 0;
          const streamDone =
            !holdActive &&
            (out.live?.streamStatus === "finished" ||
              Boolean(out.live?.endedAt));
          if (
            newest &&
            !newest.endedAt &&
            streamDone &&
            out.live?.streamId === newest.id
          ) {
            newest.endedAt =
              out.live.endedAt ||
              new Date(out.live.updatedAt || Date.now()).toISOString();
            if (Array.isArray(out.live.qualified) && out.live.qualified.length) {
              newest.qualified = out.live.qualified.map((q) => ({
                code: q.code,
                name: q.name,
                img: q.img,
              }));
            }
            if (out.live.winner && !newest.winner) {
              newest.winner = out.live.winner;
              if (!newest.final?.ranking?.length) {
                newest.final = {
                  ranking: [{ rank: 1, ...out.live.winner }],
                  winner: out.live.winner,
                  at: newest.endedAt,
                  recovered: true,
                };
              }
            }
            if (!newest.mode) {
              newest.mode = newest.final?.ranking?.length
                ? "final"
                : "qualifying";
            }
            if (newest.status === "winner_hold" || newest.status === "live") {
              newest.status = "finished";
            }
            // Keep rankings.json in sync with closed stream.
            fs.writeFileSync(
              "data/rankings.json",
              JSON.stringify(out.streams, null, 2)
            );
          }
          fs.writeFileSync("data/live.json", JSON.stringify(out, null, 2));
          NODE
          fi
          if [ -d .data/polls ]; then
            cp -f .data/polls/*.json data/polls/ 2>/dev/null || true
          fi
          git config user.name "flagbattle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore(data): persist stream rankings from go-live"
            git fetch origin main
            # Rebase onto latest main. On data/ conflicts, keep the persist commit
            # ("theirs" during rebase = the commit being applied).
            resolve_data_rebase() {
              echo "Rebase conflict — keeping persist data/ from this go-live"
              git checkout --theirs -- data/
              git add data/
              GIT_EDITOR=true git rebase --continue
            }
            if ! git rebase origin/main; then
              resolve_data_rebase
            fi
            # Retry push if main moved again (Contents API snapshots mid-push).
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then
                echo "Persisted data/ to main"
                break
              fi
              echo "Push failed (attempt ${attempt}); refetch and rebase"
              sleep $((attempt * 4))
              git fetch origin main
              if ! git rebase origin/main; then
                resolve_data_rebase
              fi
              if [ "$attempt" = "4" ]; then
                echo "Failed to push persist commit after retries" >&2
                exit 1
              fi
            done
          fi
