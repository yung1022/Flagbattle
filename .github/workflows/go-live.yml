# Auto-create a YouTube livestream and push FLAG BATTLE (no OBS).
#
# Required repository secrets:
#   GOOGLE_CLIENT_ID
#   GOOGLE_CLIENT_SECRET
#   GOOGLE_REFRESH_TOKEN
# Optional:
#   NIGHTBOT_TOKEN — auto-update Nightbot !vote to the live tunnel (saves YT API quota)
#
# Trigger from your own cron / server with workflow_dispatch (see README).
# Mode is chosen automatically from the last finished stream in data/rankings.json:
#   last = qualifying (with qualifiers) → next = final
#   otherwise → qualifying

name: Go Live — FLAG BATTLE

on:
  workflow_dispatch:
    inputs:
      demo_seconds:
        description: "Shorten clock in seconds (leave empty = full length)"
        required: false
        default: ""
      privacy:
        description: "YouTube privacyStatus (public | unlisted | private)"
        required: false
        default: "public"
      duration_minutes:
        description: "Stop the runner after N minutes (empty = 40 qual / 120 final)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: go-live
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve stream mode from last run
        id: mode
        run: |
          MODE=$(node stream/src/next-mode.js data/rankings.json)
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Next livestream mode: $MODE"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb pulseaudio pulseaudio-utils espeak-ng
          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version
          espeak-ng --version | head -1

      - name: Install stream package
        working-directory: stream
        run: npm install

      - name: Write credentials
        working-directory: stream
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          NIGHTBOT_TOKEN: ${{ secrets.NIGHTBOT_TOKEN }}
          STREAM_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          test -n "$GOOGLE_CLIENT_ID"
          test -n "$GOOGLE_CLIENT_SECRET"
          test -n "$GOOGLE_REFRESH_TOKEN"
          MODE="${STREAM_MODE:-qualifying}"
          if [ "$MODE" = "final" ]; then
            TITLE="FLAG BATTLE — Final · Last Flag Standing (Live)"
          else
            TITLE="FLAG BATTLE — Qualifying (Live)"
          fi
          {
            echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
            echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
            echo "GOOGLE_REFRESH_TOKEN=$GOOGLE_REFRESH_TOKEN"
            echo "YT_PRIVACY=public"
            echo "YT_TITLE=$TITLE"
            echo "STREAM_MODE=$MODE"
            echo "PUBLIC_SITE=https://yung1022.github.io/Flagbattle"
            # Smoother encode on GitHub-hosted runners (Shorts-friendly 9:16)
            echo "STREAM_WIDTH=720"
            echo "STREAM_HEIGHT=1280"
            echo "STREAM_FPS=30"
            # Nightbot owns !vote (no YouTube chat API polling)
            echo "CHAT_VOTE=0"
            if [ -n "$NIGHTBOT_TOKEN" ]; then
              echo "NIGHTBOT_TOKEN=$NIGHTBOT_TOKEN"
            fi
          } > .env

      - name: Go live
        working-directory: stream
        env:
          DEMO_SECONDS: ${{ inputs.demo_seconds }}
          DURATION_MIN: ${{ inputs.duration_minutes }}
          PRIVACY: ${{ inputs.privacy }}
          STREAM_MODE: ${{ steps.mode.outputs.mode }}
          PUBLIC_SITE: https://yung1022.github.io/Flagbattle
          STREAM_WIDTH: "720"
          STREAM_HEIGHT: "1280"
          STREAM_FPS: "30"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_DATA_BRANCH: main
        run: |
          set +e
          MODE="${STREAM_MODE:-qualifying}"
          # Final (hole→Swiss→Final4) needs more wall clock than Qualifying.
          if [ -n "${DURATION_MIN}" ]; then
            RUN_MIN="${DURATION_MIN}"
          elif [ "$MODE" = "final" ]; then
            RUN_MIN="120"
          else
            RUN_MIN="40"
          fi
          EXTRA=(--mode "$MODE")
          if [ -n "${DEMO_SECONDS}" ]; then
            EXTRA+=(--demo "${DEMO_SECONDS}")
          fi
          EXTRA+=(--privacy "${PRIVACY:-public}")
          echo "Go-live mode=$MODE duration_cap=${RUN_MIN}m"
          timeout "${RUN_MIN}m" npm run go-live -- "${EXTRA[@]}"
          code=$?
          set -e
          # 124 = timeout hit planned end; treat as clean stop
          if [ "$code" = "124" ] || [ "$code" = "0" ]; then
            exit 0
          fi
          exit "$code"

      - name: Persist ranking history to data/
        if: always()
        run: |
          mkdir -p data/polls
          if [ -f .data/rankings.json ]; then
            cp .data/rankings.json data/rankings.json
          fi
          if [ -f .data/live.json ]; then
            node <<'NODE'
          const fs = require("fs");
          const live = JSON.parse(fs.readFileSync(".data/live.json", "utf8"));
          const out = {
            live: live.live || null,
            streams: live.streams || [],
            api: null,
            updatedAt: Date.now(),
          };
          // Close unfinished newest stream if the live snapshot already finished
          // (protects against dropped stream POSTs near process kill).
          const newest = out.streams?.[0];
          if (
            newest &&
            !newest.endedAt &&
            out.live?.phase === "finished" &&
            out.live?.streamId === newest.id
          ) {
            newest.endedAt = new Date(
              out.live.updatedAt || Date.now()
            ).toISOString();
            if (Array.isArray(out.live.qualified) && out.live.qualified.length) {
              newest.qualified = out.live.qualified.map((q) => ({
                code: q.code,
                name: q.name,
                img: q.img,
              }));
            }
            if (out.live.winner && !newest.winner) {
              newest.winner = out.live.winner;
              if (!newest.final?.ranking?.length) {
                newest.final = {
                  ranking: [{ rank: 1, ...out.live.winner }],
                  winner: out.live.winner,
                  at: newest.endedAt,
                  recovered: true,
                };
              }
            }
            if (!newest.mode) {
              newest.mode = newest.final?.ranking?.length
                ? "final"
                : "qualifying";
            }
            // Keep rankings.json in sync with closed stream.
            fs.writeFileSync(
              "data/rankings.json",
              JSON.stringify(out.streams, null, 2)
            );
          }
          fs.writeFileSync("data/live.json", JSON.stringify(out, null, 2));
          NODE
          fi
          if [ -d .data/polls ]; then
            cp -f .data/polls/*.json data/polls/ 2>/dev/null || true
          fi
          git config user.name "flagbattle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore(data): persist stream rankings from go-live"
            git fetch origin main
            # Rebase onto latest main. On data/ conflicts, keep the persist commit
            # ("theirs" during rebase = the commit being applied).
            resolve_data_rebase() {
              echo "Rebase conflict — keeping persist data/ from this go-live"
              git checkout --theirs -- data/
              git add data/
              GIT_EDITOR=true git rebase --continue
            }
            if ! git rebase origin/main; then
              resolve_data_rebase
            fi
            # Retry push if main moved again (Contents API snapshots mid-push).
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then
                echo "Persisted data/ to main"
                break
              fi
              echo "Push failed (attempt ${attempt}); refetch and rebase"
              sleep $((attempt * 4))
              git fetch origin main
              if ! git rebase origin/main; then
                resolve_data_rebase
              fi
              if [ "$attempt" = "4" ]; then
                echo "Failed to push persist commit after retries" >&2
                exit 1
              fi
            done
          fi
